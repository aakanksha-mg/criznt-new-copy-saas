<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Rich diagonal gradient for the continuous Blue "C" ribbon -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099FF" />
      <stop offset="40%" stop-color="#0055D4" />
      <stop offset="100%" stop-color="#000C30" />
    </linearGradient>

    <!-- Metallic gradient pulling from bottom-right (bright) to top-left (dark/shadow) -->
    <linearGradient id="silverGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#D0D5DB" />
      <stop offset="100%" stop-color="#2D3748" />
    </linearGradient>

    <!-- Global drop shadow for depth -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- Base Outer Blue Hexagonal Ribbon -->
    <!-- Mapped exactly to a 30/60 isometric projection grid -->
    <path
      d="M 99 37.5 
         L 60 15 
         L 21 37.5 
         L 21 82.5 
         L 60 105 
         L 99 82.5 
         L 79.5 71.25 
         L 60 82.5 
         L 40.5 71.25 
         L 40.5 48.75 
         L 60 37.5 
         L 79.5 48.75 
         Z"
      fill="url(#blueGrad)"
    />

    <!-- Overlapping Silver Fold -->
    <!-- Forms a perfect plane connecting the bottom-right cut to the inner top-left corner -->
    <path
      d="M 99 82.5 
         L 79.5 71.25 
         L 40.5 48.75 
         Z"
      fill="url(#silverGrad)"
    />
  </g>
</svg>
